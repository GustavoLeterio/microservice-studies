<app-doc-layout spyKey="endpoints-catalog">
  <app-page-header
    [heading]="ui().catalogTitle"
    [lead]="ui().catalogLead"
  />

  <app-section sectionId="filtros" [heading]="ui().filters">
    <div class="filters">
      <label>
        {{ ui().method }}
        <select [value]="methodFilter()" (change)="methodFilter.set($any($event.target).value)">
          <option value="ALL">{{ ui().all }}</option>
          @for (method of methods; track method) {
            <option [value]="method">{{ method }}</option>
          }
        </select>
      </label>
      <label>
        {{ ui().service }}
        <select [value]="serviceFilter()" (change)="serviceFilter.set($any($event.target).value)">
          <option value="ALL">{{ ui().all }}</option>
          @for (name of services(); track name) {
            <option [value]="name">{{ name }}</option>
          }
        </select>
      </label>
      <label class="filters__search">
        {{ ui().search }}
        <input type="search" [placeholder]="ui().searchRoutes" [value]="query()" (input)="query.set($any($event.target).value)" />
      </label>
    </div>
    <p class="count">{{ filtered().length }} {{ ui().routesCount }}</p>
  </app-section>

  <app-section sectionId="lista" [heading]="ui().businessRoutes">
    <div class="list">
      @for (item of filtered(); track item.id) {
        <div class="item">
          <p class="item__service">
            <a [routerLink]="'/explorador/servicos/' + item.service.id">{{ item.service.name }}</a>
            · {{ item.group.title }}
          </p>
          <app-endpoint-panel [endpoint]="item" />
        </div>
      } @empty {
        <p>{{ ui().noRoutes }}</p>
      }
    </div>
  </app-section>
</app-doc-layout>
