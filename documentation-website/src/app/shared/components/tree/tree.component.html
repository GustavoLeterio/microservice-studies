<figure class="tree">
  <ng-template #branch let-items>
    <ul class="tree__list">
      @for (node of items; track $index) {
        <li class="tree__node">
          <span class="tree__item" [attr.data-kind]="node.kind ?? (node.children?.length ? 'folder' : 'file')"
            [class.is-highlight]="node.highlight">
            <app-icon [name]="iconFor(node)" />
            <span class="tree__label">{{ node.label }}</span>
            @if (node.note) {
              <span class="tree__note">{{ node.note }}</span>
            }
          </span>
          @if (node.children?.length) {
            <ng-container *ngTemplateOutlet="branch; context: { $implicit: node.children }" />
          }
        </li>
      }
    </ul>
  </ng-template>

  <div class="tree__root">
    <ng-container *ngTemplateOutlet="branch; context: { $implicit: nodes() }" />
  </div>

  @if (caption()) {
    <figcaption class="tree__caption prose" [innerHTML]="caption()"></figcaption>
  }
</figure>
