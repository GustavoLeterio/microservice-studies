server:
  port: 8092
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        generate_statistics: true
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
      
logging:
  level:
    root: INFO
    com.gustavoleterio.microservices.product_microservice: WARN
  patterns:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/product-microservice.log
    max-size: 10MB
    max-history: 30

management:
    endpoints:
        web:
            exposure:
                include: health, info, prometheus
    endpoint:
        health:
            show-details: always

