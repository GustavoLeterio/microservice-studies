services:
  mongodb:
    image: mongo
    container_name: mongo_db
    ports:
      - "${MONGO_DB_PORT}:27017"
    volumes:
      - mongo:/data/db
    restart: always
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_DB_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_DB_PASSWORD}
    networks:
      - microservices
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 3s
      retries: 5

  postgres:
    container_name: postgresql_db
    image: postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${PRODUCT_DB_NAME}
    volumes:
      - postgres:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - microservices
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    container_name: api-gateway
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${GATEWAY_SERVER_PORT}:8222"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:${CONFIG_SERVER_PORT}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-server:${DISCOVERY_SERVER_PORT}/eureka/
    networks:
      - microservices

  config-server:
    build:
      context: .
      dockerfile: ./config-server/Dockerfile
    container_name: config-server
    ports:
      - "${CONFIG_SERVER_PORT}:8888"
    networks:
      - microservices
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://config-server:${CONFIG_SERVER_PORT}/actuator/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: on-failure

  discovery-server:
    build:
      context: .
      dockerfile: ./discovery-server/Dockerfile
    container_name: discovery-server
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:${CONFIG_SERVER_PORT}
    networks:
      - microservices
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://discovery-server:${DISCOVERY_SERVER_PORT}/actuator/health",
        ]
      interval: 30s
      timeout: 3s
      retries: 5
    restart: on-failure

  customer-microservice:
    build:
      context: .
      dockerfile: ./microservices/customer-microservice/Dockerfile
    container_name: customer-microservice
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${CUSTOMER_MICROSERVICE_PORT}:8091"
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:${CONFIG_SERVER_PORT}
      - EUREKA_DEFAULT_ZONE=http://discovery-server:${DISCOVERY_SERVER_PORT}/eureka
      - SPRING_MONGODB_URI=mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@mongodb:${MONGO_DB_PORT}/${CUSTOMER_DB_NAME}?authSource=admin
    networks:
      - microservices
    volumes:
      - ./microservices/customer-microservice/logs:/app/logs

  product-microservice:
    build:
      context: .
      dockerfile: ./microservices/product-microservice/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:${POSTGRES_PORT}/${PRODUCT_DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:${CONFIG_SERVER_PORT}
      - EUREKA_DEFAULT_ZONE=http://discovery-server:${DISCOVERY_SERVER_PORT}/eureka
    networks:
      - microservices
    volumes:
      - ./microservices/product-microservice/logs:/app/logs

  cart-microservice:
    build:
      context: .
      dockerfile: ./microservices/cart-microservice/Dockerfile
    depends_on:
      mongodb:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    volumes:
      - ./microservices/cart-microservice/logs:/app/logs
    environment:
      - SPRING_CONFIG_IMPORT=configserver:http://config-server:${CONFIG_SERVER_PORT}
      - EUREKA_DEFAULT_ZONE=http://discovery-server:${DISCOVERY_SERVER_PORT}/eureka
      - SPRING_MONGODB_URI=mongodb://${MONGO_DB_USERNAME}:${MONGO_DB_PASSWORD}@mongodb:${MONGO_DB_PORT}/${CART_DB_NAME}?authSource=admin
    networks:
      - microservices

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - microservices

  grafana:
    image: grafana/grafana:latest
    ports:
      - "${GRAFANA_PORT}:3000"
    volumes:
      - ./grafana.data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on: 
      - prometheus
    networks:
      - microservices

  documentation-website:
    build: ./documentation-website
    container_name: documentation-website
    ports:
      - "${DOCUMENTATION_WEBSITE_PORT}:80"
    networks:
      - microservices

volumes:
  mongo:
  postgres:
  grafana-data:

networks:
  microservices:
    driver: bridge

  config-server:
